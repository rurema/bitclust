name: Release

# タグ push で起動し、RubyGems.org への公開に成功してから GitHub release を
# 作成する(immutable releases 対応のため、release 作成をトリガーにしない)。
# リリースは GitHub の Web UI で release を作らず、master のリリースコミットに
# タグ(vX.Y.Z)を打って push するだけにする。Web UI で release を先に作ると、
# その操作によるタグ push でこの workflow が起動し、gem の公開までは成功するが
# 最後の gh release create が「a release with the same tag name already
# exists」で失敗して gem がアセットに付かない(v1.9.0 で発生。アセットは後から
# gh release upload で補えたが、immutable releases を有効にすると補えない)。
# 認証は rubygems.org の trusted publishing(OIDC)。事前に rubygems.org 側で
# bitclust-core / bitclust-dev / bitclust-irb / refe2 の 4 gem それぞれに、
# このリポジトリの release.yml(environment: release)を trusted publisher
# として登録しておくこと。未公開の gem を新たに増やしたときは、タグを push
# する前に pending trusted publisher(未公開 gem 名の事前登録。有効期限あり)
# として登録する。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # GitHub release の作成
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build gems
        run: |
          set -x
          for gemspec in *.gemspec; do
            gem build "$gemspec"
          done

      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gems to RubyGems.org
        run: |
          set -x
          for gem in *.gem; do
            gem push "$gem"
          done

      # gem push がすべて成功した後にのみ GitHub release を作る
      # (immutable releases では release 資産を後から差し替えられないため)
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes *.gem
        env:
          GH_TOKEN: ${{ github.token }}
